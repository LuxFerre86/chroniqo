name: PR Build

on:
  pull_request:
    branches:
      - master
      - release/**

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build + Test (backend + frontend)
        run: mvn -B clean verify

      - name: Build Docker Image (for scan)
        run: docker build -t chroniqo:pr-${{ github.sha }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: chroniqo:pr-${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true